[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitguard"
version = "0.2.0"
description = "Autonomous signing-request firewall and incident-replay lab for exchange hot wallets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0.1",
    "eth-account>=0.11.0",
    "rlp>=4.0.0",
    "pynacl>=1.5.0",
    "cryptography>=42.0.0",
    "webauthn>=2.4.0",
    "embit>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "fakeredis[lua]>=2.20.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-redis",
    "types-PyYAML",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests", "tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --import-mode=importlib -p no:hypothesispytest"
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    "node_modules",
    "frontend",
    "venv",
    "__pycache__",
    "dist",
    "services/bitguard/alembic/env.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Query/Depends)
]

[tool.ruff.lint.per-file-ignores]
"lab/loadtest/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "services"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = [
    "venv",
    "node_modules",
    "frontend",
    "services/bitguard/alembic",
]

[[tool.mypy.overrides]]
module = [
    "services.signer_shim.*",
    "services.bitguard.tokens.*",
    "services.bitguard.audit.*",
    "services.bitguard.breaker.*",
]
disallow_untyped_defs = true
check_untyped_defs = true
