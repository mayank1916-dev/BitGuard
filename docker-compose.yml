version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitguard"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bitguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - public
      - signer_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: bitguard-anvil
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    networks:
      - public
      - signer_internal

  ledger_mock:
    build:
      context: .
      dockerfile: services/ledger_mock/Dockerfile
    container_name: bitguard-ledger-mock
    restart: unless-stopped
    environment:
      LEDGER_MOCK_HOST: "0.0.0.0"
      LEDGER_MOCK_PORT: 8002
      LEDGER_MOCK_ENVIRONMENT: "development"
    ports:
      - "8002:8002"
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

  signer_shim:
    build:
      context: .
      dockerfile: services/signer_shim/Dockerfile
    container_name: bitguard-signer-shim
    restart: unless-stopped
    environment:
      SIGNER_SHIM_HOST: "0.0.0.0"
      SIGNER_SHIM_PORT: 8001
      SIGNER_SHIM_ENVIRONMENT: "development"
      SIGNER_SHIM_ANVIL_URL: "http://anvil:8545"
      SIGNER_SHIM_REDIS_URL: "redis://redis:6379/0"
    # Port 8001 is EXPOSED internally to signer_internal, NEVER published to host
    expose:
      - "8001"
    networks:
      - signer_internal
    depends_on:
      - anvil
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

  bitguard:
    build:
      context: .
      dockerfile: services/bitguard/Dockerfile
    container_name: bitguard-firewall
    restart: unless-stopped
    environment:
      BITGUARD_HOST: "0.0.0.0"
      BITGUARD_PORT: 8000
      BITGUARD_ENVIRONMENT: "development"
      BITGUARD_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/bitguard"
      BITGUARD_REDIS_URL: "redis://redis:6379/0"
      BITGUARD_ANVIL_URL: "http://anvil:8545"
      BITGUARD_SIGNER_SHIM_URL: "http://signer_shim:8001"
      BITGUARD_LEDGER_MOCK_URL: "http://ledger_mock:8002"
      BITGUARD_AUDIT_MINIO_ENDPOINT: "http://minio:9000"
      BITGUARD_AUDIT_MINIO_BUCKET: "bitguard-audit-anchors"
    ports:
      - "8000:8000"
    networks:
      - public
      - signer_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      anvil:
        condition: service_started
      signer_shim:
        condition: service_started
      ledger_mock:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: bitguard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: bitguard-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - public
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --with-lock myminio/bitguard-audit-anchors || true;
      exit 0;
      "

  demo_custody:
    build:
      context: .
      dockerfile: lab/demo_custody/Dockerfile
    container_name: bitguard-demo-custody
    restart: unless-stopped
    environment:
      DEMO_CUSTODY_HOST: "0.0.0.0"
      DEMO_CUSTODY_PORT: 8003
      DEMO_CUSTODY_BITGUARD_URL: "http://bitguard:8000"
      DEMO_CUSTODY_SAN: "spiffe://exchange.internal/workload/custody"
    ports:
      - "8003:8003"
    networks:
      - public
    depends_on:
      bitguard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8003/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bitguard-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/bitguard-realm.json:/opt/keycloak/data/import/bitguard-realm.json:ro
    ports:
      - "8080:8080"
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  public:
    driver: bridge
  signer_internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
