name: BitGuard CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pydantic-settings sqlalchemy alembic redis types-redis

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Mypy Type Checking
        run: |
          mypy --explicit-package-bases services backend tests

      - name: Publish Built Image Attestation (Milestone S33 / F16)
        run: |
          python scripts/publish_image_digest.py --image "bitguard/custody-workload" --tag "ci" --output policy/allowed_images.json

      - name: Run Pytest Test Suite
        run: |
          python -m pytest backend/tests tests -v

  integration-lab:
    name: Integration Lab (F19)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pydantic-settings sqlalchemy alembic redis types-redis fakeredis pyyaml eth-account eth-utils rlp pynacl webauthn cryptography

      - name: Run Integration Lab Runner
        run: |
          python -m lab.runner.main

      - name: Upload Lab Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitguard-lab-results
          path: lab/results/
          retention-days: 14
